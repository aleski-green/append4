name: LMDB storage
on:
  push:
    branches: [codex/lmdb-storage]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  storage:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.14.1'
          cabal-version: '3.18.2.0'
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: spec
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - run: cabal build exe:append4-fixture
        shell: bash
      - name: Storage behavior and killed-writer recovery
        working-directory: spec
        shell: bash
        run: lean --run Main.lean "$(cabal --project-dir=.. list-bin exe:append4-fixture | tr -d '\r')"
